[project]
name = "qqracing-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
qqracing-bot = "qqracing_bot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
